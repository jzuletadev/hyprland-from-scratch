<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  ~/hyprland-from-scratch/dotfiles/fontconfig/fonts.conf

  Phase 25. Apps and web pages: sans-serif (and system-ui, which follows it) is
  Adwaita Sans, GNOME's UI font derived from Inter, installed with GTK
  (adwaita-fonts); Noto Sans stays as fallback for the scripts Adwaita Sans
  lacks. Serif keeps Noto; monospace (code on web pages, <tt> in tooltips) is
  JetBrains Mono, like the terminal. Also:
    - the generic "emoji" family means Noto Color Emoji (before: a musical
      notation font, so emoji showed as empty boxes)
    - right after each family's main font, color emoji are tried first, so a
      monochrome emoji-like glyph from some text font doesn't win
  Needs noto-fonts-emoji (and noto-fonts-cjk for Chinese/Japanese/Korean text).
-->
<fontconfig>
  <alias binding="same">
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Adwaita Sans</family>
      <family>Noto Sans</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Sans Mono</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
