# ~/hyprland-from-scratch/dotfiles/kitty/kitty.conf

# ---- Font ----
font_family      JetBrainsMono Nerd Font
font_size        11.0

# ---- Cursor ----
cursor_shape     beam
cursor_blink_interval 0

# ---- Window ----
window_padding_width 10
background_opacity   0.85
dynamic_background_opacity yes
confirm_os_window_close 0
remember_window_size no
tab_bar_style    powerline
tab_powerline_style slanted

background            #141414
foreground             #e0e0e0
selection_background   #1f4560
selection_foreground   #e0e0e0
cursor                 #1793d1
cursor_text_color      #141414
url_color              #5db3df

active_border_color    #1793d1
inactive_border_color  #333333
active_tab_background  #141414
active_tab_foreground  #1793d1
inactive_tab_background #1f1f1f
inactive_tab_foreground #6e6e6e

# black
color0  #1f1f1f
color8  #5c5c5c
# red
color1  #e05f65
color9  #f07a80
# green
color2  #8cc265
color10 #a6d986
# yellow
color3  #e0a84e
color11 #f0c278
# blue (Arch)
color4  #1793d1
color12 #5db3df
# magenta (muted rose, keeps purple out of the palette)
color5  #c27aa9
color13 #d79bc2
# cyan
color6  #45b8d9
color14 #74cde6
# white
color7  #c4c4c4
color15 #f0f0f0

allow_remote_control yes
listen_on unix:/tmp/kitty
include theme.conf
