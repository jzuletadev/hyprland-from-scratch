# ~/hyprland-from-scratch/dotfiles/kitty/kitty.conf
#
# Kitty config — Phase 11 baseline (Tokyo Night). Never themed since
# Phase 1; this is kitty's first real config in the repo.

# ---- Font ----
font_family      JetBrainsMono Nerd Font
font_size        11.0

# ---- Cursor ----
cursor_shape     beam
cursor_blink_interval 0

# ---- Window ----
window_padding_width 10
background_opacity   0.92
confirm_os_window_close 0

# ---- Tab bar (kept plain: single-tab usage is the common case here) ----
tab_bar_style    powerline
tab_powerline_style slanted

# ---- Tokyo Night colors ----
background            #1a1b26
foreground             #c0caf5
selection_background   #283457
selection_foreground   #c0caf5
cursor                 #c0caf5
cursor_text_color      #1a1b26
url_color              #73daca

active_border_color    #7aa2f7
inactive_border_color  #292e42
active_tab_background  #1a1b26
active_tab_foreground  #7aa2f7
inactive_tab_background #24283b
inactive_tab_foreground #565f89

# black
color0  #15161e
color8  #414868
# red
color1  #f7768e
color9  #f7768e
