# Autogenerado desde dracula.yazi (Dracula)
[flavor]
use = "dracula"
dark = "dracula"
light = "dracula"

[icon]
prepend_dirs = [
  { name = ".config", text = "", fg = "#ff5555" },
  { name = ".git", text = "", fg = "#bd93f9" },
  { name = "Desktop", text = "", fg = "#8be9fd" },
  { name = "Downloads", text = "", fg = "#f1fa8c" },
  { name = "Documents", text = "", fg = "#50fa7b" },
  { name = "Music", text = "", fg = "#8be9fd" },
  { name = "Pictures", text = "", fg = "#ff79c6" },
  { name = "Fotos", text = "", fg = "#ff79c6" },
  { name = "Videos", text = "", fg = "#ff5555" },
  { name = "Screenshots", text = "", fg = "#ff79c6" },
  { name = "Public", text = "", fg = "#50fa7b" },
  { name = "Templates", text = "", fg = "#bd93f9" },
  { name = "dev", text = "", fg = "#8be9fd" },
  { name = "hyprland-from-scratch", text = "󰣇", fg = "#f1fa8c" },
]

prepend_conds = [
  { if = "dir & hovered", text = "", fg = "#f1fa8c" },
  { if = "dir", text = "", fg = "#bd93f9" },
]

prepend_globs = [
  { url = "*.{jpg,jpeg,png,gif,webp,svg,bmp,ico,tiff,heic}", text = "", fg = "#f1fa8c" },
  { url = "*.{mp4,mkv,mov,avi,webm,flv,wmv,mpeg}", text = "", fg = "#50fa7b" },
  { url = "*.{mp3,flac,wav,m4a,ogg,opus,aac,wma}", text = "", fg = "#ff79c6" },
  { url = "*.{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", text = "", fg = "#ff5555" },
]
