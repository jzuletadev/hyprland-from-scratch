[mgr]
cwd = { fg = "#1793d1", bold = true }
find_keyword = { fg = "#5db3df", bold = true, italic = true }
find_position = { fg = "#e05f65", bold = true }
marker_selected = { fg = "#5aef7d", bg = "#5aef7d" }
marker_copied = { fg = "#5db3df", bg = "#5db3df" }
marker_cut = { fg = "#e05f65", bg = "#e05f65" }
tab_active = { fg = "#141414", bg = "#1793d1", bold = true }
tab_inactive = { fg = "#e0e0e0", bg = "#2b2b2b" }
border_style = { fg = "#1793d1" }

[status]
separator_open = ""
separator_close = ""
separator_style = { fg = "#2b2b2b", bg = "#2b2b2b" }
mode_normal = { fg = "#141414", bg = "#1793d1", bold = true }
mode_select = { fg = "#141414", bg = "#5aef7d", bold = true }
mode_unset = { fg = "#141414", bg = "#e05f65", bold = true }
progress_label = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#1793d1", bg = "#2b2b2b" }
progress_error = { fg = "#e05f65", bg = "#2b2b2b" }
permissions_t = { fg = "#1793d1" }
permissions_r = { fg = "#5db3df" }
permissions_w = { fg = "#e05f65" }
permissions_x = { fg = "#5aef7d" }
permissions_s = { fg = "#6e6e6e" }

[select]
border = { fg = "#1793d1" }
active = { fg = "#e05f65", bold = true }
inactive = { fg = "#e0e0e0" }

[input]
border = { fg = "#1793d1" }
title = { fg = "#1793d1" }
value = { fg = "#e0e0e0" }
selected = { reversed = true }

[which]
cols = 3
mask = { bg = "#101010" }
cand = { fg = "#1793d1" }
rest = { fg = "#5db3df" }
desc = { fg = "#e0e0e0" }
separator = "  "
separator_style = { fg = "#3b3b3b" }

[filetype]
rules = [
    { mime = "inode/directory", fg = "#1793d1", bold = true },
    { mime = "application/*zip", fg = "#e05f65" },
    { mime = "application/x-tar", fg = "#e05f65" },
    { mime = "application/x-bzip*", fg = "#e05f65" },
    { mime = "application/x-7z-compressed", fg = "#e05f65" },
    { mime = "application/x-rar", fg = "#e05f65" },
    { mime = "image/*", fg = "#5db3df" },
    { mime = "video/*", fg = "#e0a84e" },
    { mime = "audio/*", fg = "#e0a84e" },
    { mime = "application/pdf", fg = "#5aef7d" },
    { url = "*", fg = "#e0e0e0" }
]
