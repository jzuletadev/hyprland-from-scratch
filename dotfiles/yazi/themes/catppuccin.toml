[mgr]
cwd = { fg = "#cba6f7", bold = true }
find_keyword = { fg = "#f9e2af", bold = true, italic = true }
find_position = { fg = "#f38ba8", bold = true }
marker_selected = { fg = "#a6e3a1", bg = "#a6e3a1" }
marker_copied = { fg = "#f9e2af", bg = "#f9e2af" }
marker_cut = { fg = "#f38ba8", bg = "#f38ba8" }
tab_active = { fg = "#1e1e2e", bg = "#cba6f7", bold = true }
tab_inactive = { fg = "#cdd6f4", bg = "#313244" }
border_style = { fg = "#cba6f7" }

[status]
separator_open = ""
separator_close = ""
separator_style = { fg = "#313244", bg = "#313244" }
mode_normal = { fg = "#1e1e2e", bg = "#cba6f7", bold = true }
mode_select = { fg = "#1e1e2e", bg = "#a6e3a1", bold = true }
mode_unset = { fg = "#1e1e2e", bg = "#f38ba8", bold = true }
progress_label = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#cba6f7", bg = "#313244" }
progress_error = { fg = "#f38ba8", bg = "#313244" }
permissions_t = { fg = "#cba6f7" }
permissions_r = { fg = "#f9e2af" }
permissions_w = { fg = "#f38ba8" }
permissions_x = { fg = "#a6e3a1" }
permissions_s = { fg = "#6c7086" }

[select]
border = { fg = "#cba6f7" }
active = { fg = "#f38ba8", bold = true }
inactive = { fg = "#cdd6f4" }

[input]
border = { fg = "#cba6f7" }
title = { fg = "#cba6f7" }
value = { fg = "#cdd6f4" }
selected = { reversed = true }

[which]
cols = 3
mask = { bg = "#181825" }
cand = { fg = "#cba6f7" }
rest = { fg = "#9399b2" }
desc = { fg = "#cdd6f4" }
separator = "  "
separator_style = { fg = "#585b70" }

[filetype]
rules = [
    { mime = "inode/directory", fg = "#cba6f7", bold = true },
    { mime = "application/*zip", fg = "#f38ba8" },
    { mime = "application/x-tar", fg = "#f38ba8" },
    { mime = "application/x-bzip*", fg = "#f38ba8" },
    { mime = "application/x-7z-compressed", fg = "#f38ba8" },
    { mime = "application/x-rar", fg = "#f38ba8" },
    { mime = "image/*", fg = "#f9e2af" },
    { mime = "video/*", fg = "#fab387" },
    { mime = "audio/*", fg = "#fab387" },
    { mime = "application/pdf", fg = "#a6e3a1" },
    { url = "*", fg = "#cdd6f4" }
]
