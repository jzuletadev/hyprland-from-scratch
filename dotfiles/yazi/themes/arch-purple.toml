[mgr]
cwd = { fg = "#9564dd", bold = true }
find_keyword = { fg = "#be9cec", bold = true, italic = true }
find_position = { fg = "#ff5555", bold = true }
marker_selected = { fg = "#50fa7b", bg = "#50fa7b" }
marker_copied = { fg = "#f1fa8c", bg = "#f1fa8c" }
marker_cut = { fg = "#ff5555", bg = "#ff5555" }
tab_active = { fg = "#141414", bg = "#9564dd", bold = true }
tab_inactive = { fg = "#e0e0e0", bg = "#2b2b2b" }
border_style = { fg = "#9564dd" }

[status]
separator_open = ""
separator_close = ""
separator_style = { fg = "#2b2b2b", bg = "#2b2b2b" }
mode_normal = { fg = "#141414", bg = "#9564dd", bold = true }
mode_select = { fg = "#141414", bg = "#50fa7b", bold = true }
mode_unset = { fg = "#141414", bg = "#ff5555", bold = true }
progress_label = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#9564dd", bg = "#2b2b2b" }
progress_error = { fg = "#ff5555", bg = "#2b2b2b" }
permissions_t = { fg = "#9564dd" }
permissions_r = { fg = "#be9cec" }
permissions_w = { fg = "#ff5555" }
permissions_x = { fg = "#50fa7b" }
permissions_s = { fg = "#6e6e6e" }

[select]
border = { fg = "#9564dd" }
active = { fg = "#ff5555", bold = true }
inactive = { fg = "#e0e0e0" }

[input]
border = { fg = "#9564dd" }
title = { fg = "#9564dd" }
value = { fg = "#e0e0e0" }
selected = { reversed = true }

[which]
cols = 3
mask = { bg = "#101010" }
cand = { fg = "#9564dd" }
rest = { fg = "#be9cec" }
desc = { fg = "#e0e0e0" }
separator = "  "
separator_style = { fg = "#3b3b3b" }

[filetype]
rules = [
    { mime = "inode/directory", fg = "#9564dd", bold = true },
    { mime = "application/*zip", fg = "#ff5555" },
    { mime = "application/x-tar", fg = "#ff5555" },
    { mime = "application/x-bzip*", fg = "#ff5555" },
    { mime = "application/x-7z-compressed", fg = "#ff5555" },
    { mime = "application/x-rar", fg = "#ff5555" },
    { mime = "image/*", fg = "#f1fa8c" },
    { mime = "video/*", fg = "#ffb86c" },
    { mime = "audio/*", fg = "#ffb86c" },
    { mime = "application/pdf", fg = "#50fa7b" },
    { url = "*", fg = "#e0e0e0" }
]
