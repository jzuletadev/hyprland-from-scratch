[mgr]
cwd = { fg = "#005f87", bold = true }
find_keyword = { fg = "#d75f00", bold = true, italic = true }
find_position = { fg = "#d70000", bold = true }
marker_selected = { fg = "#008700", bg = "#008700" }
marker_copied = { fg = "#d75f00", bg = "#d75f00" }
marker_cut = { fg = "#d70000", bg = "#d70000" }
tab_active = { fg = "#ffffff", bg = "#005f87", bold = true }
tab_inactive = { fg = "#444444", bg = "#e4e4e4" }
border_style = { fg = "#005f87" }

[status]
separator_open = ""
separator_close = ""
separator_style = { fg = "#d0d0d0", bg = "#d0d0d0" }
mode_normal = { fg = "#ffffff", bg = "#005f87", bold = true }
mode_select = { fg = "#ffffff", bg = "#008700", bold = true }
mode_unset = { fg = "#ffffff", bg = "#d70000", bold = true }
progress_label = { fg = "#000000", bold = true }
progress_normal = { fg = "#005f87", bg = "#d0d0d0" }
progress_error = { fg = "#d70000", bg = "#d0d0d0" }
permissions_t = { fg = "#005f87" }
permissions_r = { fg = "#d75f00" }
permissions_w = { fg = "#d70000" }
permissions_x = { fg = "#008700" }
permissions_s = { fg = "#767676" }

[select]
border = { fg = "#005f87" }
active = { fg = "#d70000", bold = true }
inactive = { fg = "#444444" }

[input]
border = { fg = "#005f87" }
title = { fg = "#005f87" }
value = { fg = "#121212" }
selected = { reversed = true }

[which]
cols = 3
mask = { bg = "#e4e4e4" }
cand = { fg = "#005f87" }
rest = { fg = "#585858" }
desc = { fg = "#121212" }
separator = "  "
separator_style = { fg = "#bcbcbc" }

[filetype]
rules = [
    { mime = "inode/directory", fg = "#005f87", bold = true },
    { mime = "application/*zip", fg = "#d70000" },
    { mime = "application/x-tar", fg = "#d70000" },
    { mime = "application/x-bzip*", fg = "#d70000" },
    { mime = "application/x-7z-compressed", fg = "#d70000" },
    { mime = "application/x-rar", fg = "#d70000" },
    { mime = "image/*", fg = "#d75f00" },
    { mime = "video/*", fg = "#af5f00" },
    { mime = "audio/*", fg = "#af5f00" },
    { mime = "application/pdf", fg = "#008700" },
    { url = "*", fg = "#262626" }
]
