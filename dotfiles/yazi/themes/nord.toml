[mgr]
cwd = { fg = "#88c0d0", bold = true }
find_keyword = { fg = "#ebcb8b", bold = true, italic = true }
find_position = { fg = "#bf616a", bold = true }
marker_selected = { fg = "#a3be8c", bg = "#a3be8c" }
marker_copied = { fg = "#ebcb8b", bg = "#ebcb8b" }
marker_cut = { fg = "#bf616a", bg = "#bf616a" }
tab_active = { fg = "#2e3440", bg = "#88c0d0", bold = true }
tab_inactive = { fg = "#eceff4", bg = "#3b4252" }
border_style = { fg = "#88c0d0" }

[status]
separator_open = ""
separator_close = ""
separator_style = { fg = "#3b4252", bg = "#3b4252" }
mode_normal = { fg = "#2e3440", bg = "#88c0d0", bold = true }
mode_select = { fg = "#2e3440", bg = "#a3be8c", bold = true }
mode_unset = { fg = "#2e3440", bg = "#bf616a", bold = true }
progress_label = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#88c0d0", bg = "#3b4252" }
progress_error = { fg = "#bf616a", bg = "#3b4252" }
permissions_t = { fg = "#88c0d0" }
permissions_r = { fg = "#ebcb8b" }
permissions_w = { fg = "#bf616a" }
permissions_x = { fg = "#a3be8c" }
permissions_s = { fg = "#4c566a" }

[select]
border = { fg = "#88c0d0" }
active = { fg = "#bf616a", bold = true }
inactive = { fg = "#eceff4" }

[input]
border = { fg = "#88c0d0" }
title = { fg = "#88c0d0" }
value = { fg = "#eceff4" }
selected = { reversed = true }

[which]
cols = 3
mask = { bg = "#242933" }
cand = { fg = "#88c0d0" }
rest = { fg = "#81a1c1" }
desc = { fg = "#eceff4" }
separator = "  "
separator_style = { fg = "#4c566a" }

[filetype]
rules = [
    { mime = "inode/directory", fg = "#88c0d0", bold = true },
    { mime = "application/*zip", fg = "#bf616a" },
    { mime = "application/x-tar", fg = "#bf616a" },
    { mime = "application/x-bzip*", fg = "#bf616a" },
    { mime = "application/x-7z-compressed", fg = "#bf616a" },
    { mime = "application/x-rar", fg = "#bf616a" },
    { mime = "image/*", fg = "#ebcb8b" },
    { mime = "video/*", fg = "#d08770" },
    { mime = "audio/*", fg = "#d08770" },
    { mime = "application/pdf", fg = "#a3be8c" },
    { url = "*", fg = "#eceff4" }
]
