# ~/hyprland-from-scratch/dotfiles/hypr/hyprland.conf
#
# Minimal Hyprland config — Phase 1 baseline, themed in Phase 10 (Tokyo Night).
# Every section is intentionally small so each future addition is a
# deliberate, understood change instead of inherited template noise.

# ---- Monitor ----
# ,preferred,auto,1  ->  any monitor, preferred resolution/refresh, auto position, scale 1
monitor = ,preferred,auto,1

# ---- Environment ----
env = XCURSOR_SIZE,24

# ---- Input ----
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

# ---- General look (Tokyo Night: bg #1a1b26, fg #c0caf5, blue #7aa2f7, purple #bb9af7) ----
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    col.inactive_border = rgba(292e42aa)
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 0.97
    inactive_opacity = 0.90

    blur {
        enabled = true
        size = 6
        passes = 2
    }
}

animations {
    enabled = true
    bezier = tokyoNight, 0.16, 1, 0.3, 1

    animation = windows, 1, 4, tokyoNight, popin 80%
    animation = windowsOut, 1, 4, tokyoNight, popin 80%
    animation = border, 1, 8, tokyoNight
    animation = fade, 1, 4, tokyoNight
    animation = workspaces, 1, 5, tokyoNight, slide
}

# ---- Keybinds ----
$mainMod = SUPER
$terminal = kitty

bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, V, togglefloating,

# move focus between windows
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# switch workspaces 1-5
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
# move active window to workspace 1-5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

exec-once = awww-daemon
exec-once = awww img ~/hyprland-from-scratch/assets/wallpapers/1.jpg
exec-once = waybar
exec-once = dunst
exec-once = hypridle
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, R, exec, rofi -show drun

bind = $mainMod, E, exec, thunar

bindel = ,XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl set 5%-

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bind = $mainMod, S, exec, grim ~/Pictures/screenshots/$(date +%Y%m%d-%H%M%S).png
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" ~/Pictures/screenshots/$(date +%Y%m%d-%H%M%S).png
bind = $mainMod CTRL, S, exec, grim -g "$(slurp)" - | wl-copy

# system monitor, floating+centered via an inline exec rule (the standalone
# windowrulev2 keyword is deprecated on this Hyprland version and the new
# unified windowrule syntax couldn't be determined — see README Phase 11)
bind = $mainMod, Escape, exec, [float;size 800 500;center] kitty --class btop-floating -e btop

