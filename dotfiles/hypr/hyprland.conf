# ~/hyprland-from-scratch/dotfiles/hypr/hyprland.conf

# ,preferred,auto,1  ->  any other monitor, preferred resolution/refresh, auto position, scale 1
monitor = ,preferred,auto,1

# ---- Environment ----
env = XCURSOR_SIZE,20
env = EDITOR,nvim
env = VISUAL,nvim

# ---- Input ----
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

# ---- Window border: size and colors live in appearance.conf (Phase 27) ----
source = ~/.config/hypr/appearance.conf

# ---- General look ----
general {
    gaps_in = 3
    gaps_out = 6
    border_size = $border_size
    col.active_border = $border_active
    col.inactive_border = $border_inactive
    layout = dwindle
    resize_on_border = true
    extend_border_grab_area = 15
    hover_icon_on_border = true
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = true
        size = 6
        passes = 2
    }
}

animations {
    enabled = true
    bezier = smoothOut, 0.16, 1, 0.3, 1      # fast start, gentle stop: things arriving
    bezier = smoothIn, 0.32, 0, 0.67, 0      # gentle start, fast end: things leaving

    animation = windows, 1, 4, smoothOut, popin 80%
    animation = windowsOut, 1, 4, smoothOut, popin 80%
    animation = border, 1, 8, smoothOut
    animation = fade, 1, 4, smoothOut
    animation = workspaces, 1, 5, smoothOut, slide

    # Popups = layer-shell surfaces (Rofi menus, notifications, the bar).
    animation = layersIn, 1, 3, smoothOut, fade
    animation = layersOut, 1, 2, smoothIn, fade
    animation = fadeLayersIn, 1, 3, smoothOut
    animation = fadeLayersOut, 1, 2, smoothIn
}

# ---- Layer rules ----
# v2: ya no hay barra ni lanzador. Waybar y Rofi se fueron con la v1, y sus reglas
# con ellas; solo queda dunst, que sigue siendo el demonio de notificaciones.
layerrule = animation slide right, match:namespace notifications     # dunst slides in from the edge
# NOTE: no layerrule for the v2 `hfs-*` surfaces yet. The design wants them blurred,
# but blur never reached them: not with `layerrule = blur on, match:namespace ...`,
# and not with the block form this version actually parses
# (`layerrule { name = x; match:namespace = ...; blur = true }`), on either the top or
# the overlay layer, and not even matching every namespace. Tested with the panel at
# 75 % opacity, where blur would be obvious. Left out rather than shipping a rule that
# does nothing; the panels are opaque enough that it barely shows.
#
# Careful with the rules above: they use the flat form with a `match:` prefix, which
# this version parses WITHOUT complaining but which may never match. The block form is
# the one that errors when you get it wrong, so it is the one worth trusting.

# ---- Misc ----
misc {
    disable_hyprland_logo = true     # no default wallpaper/logo flash at login
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = rgb(141414)   # shown behind awww while it starts
    allow_session_lock_restore = true
}

# ---- Autostart ----
exec-once = awww-daemon
exec-once = ~/hyprland-from-scratch/scripts/wallpaper.sh restore
exec-once = dunst
exec-once = hypridle
exec-once = udiskie -s &
# v2: el escritorio entero —controles, espacios, reloj, cabecera, energia,
# notificaciones y portapapeles—, un juego por pantalla y todo en un solo proceso.
# Viven en la capa overlay con zona exclusiva 0, asi que no encogen nada.
exec-once = ~/.local/bin/hfs shell
# Red de seguridad: WirePlumber arranca antes de que el sistema este listo y a veces
# se salta la tarjeta de sonido interna, dejando el portatil mudo y sin microfono.
# El script comprueba el resultado a los 10 s y solo actua si falta algun perfil.
exec-once = ~/hyprland-from-scratch/scripts/audio-check.sh

# ---- Window rules ----

# SYSINFO
# La ficha del sistema de la v2. En GTK4 la clase de una ventana sale del `app_id` de
# la aplicacion y no se puede fijar por ventana, asi que la regla casa con el app_id de
# `hfs shell`, cuya unica ventana normal es esta ficha.
windowrule = float on, match:class dev.hfs.shell
windowrule = size 900 300, match:class dev.hfs.shell
windowrule = center on, match:class dev.hfs.shell












# MPV
windowrule = float on, match:class mpv
windowrule = size 1050 650, match:class mpv
windowrule = center on, match:class mpv

# ---- Keybinds ----
$mainMod = SUPER
$terminal = kitty
$scripts = ~/hyprland-from-scratch/scripts
# Por ruta absoluta a proposito: ~/.local/bin no esta en el PATH y Hyprland arranca
# por uwsm, asi que no hereda el de una shell interactiva.
$bin = ~/.local/bin/hfs

# launcher
# v2: tapping SUPER opens the wheel and the app search. This is what replaced Rofi.
# `bindrd` (on release) so that SUPER+<key> combos don't trigger it.
bindrd = $mainMod, Super_L, App search, exec, $bin wheel
# keybinds help: v2, abre la rueda directamente en el panel de Atajos
bindd = $mainMod, slash, Keybindings Help, exec, $bin atajos
# session
bindd = $mainMod, L, Lock screen, exec, hyprlock
# windows close
bindd = $mainMod, Q, Close window, killactive,
# wallpaper picker: v2, el radio de Fondo de la rueda
bindd = $mainMod, W, Wallpaper Picker, exec, $bin fondo
# file manager
# v2: Thunar takes over from Yazi, but only once it is actually installed, so this
# key keeps working on a machine that has not run the updated install.sh yet.
bindd = $mainMod, E, File manager, exec, command -v thunar >/dev/null && thunar || $terminal -e yazi
# Thunar has no flag for this: hidden files are Ctrl+H inside the window, so once
# Thunar is installed this key is just a second way to open it.
bindd = $mainMod SHIFT, E, File manager with hidden files, exec, command -v thunar >/dev/null && thunar || env YAZI_CONFIG_HOME=$HOME/hyprland-from-scratch/dotfiles/yazi-hidden $terminal -e yazi
# screen record: v2, el radio de Captura de la rueda
bindd = $mainMod, R, Screen Record Menu, exec, $bin captura
# terminal
bindd = $mainMod, T, Terminal (kitty), exec, $terminal
# screenshots (saved + copied to clipboard)
bindd = $mainMod, S, Screenshot of the monitor (saved + copied), exec, $scripts/screenshot.sh screen
bindd = $mainMod SHIFT, S, Screenshot of a region (saved + copied), exec, $scripts/screenshot.sh region
bindd = $mainMod CTRL, S, Screenshot of the window (saved + copied), exec, $scripts/screenshot.sh window
bindd = $mainMod ALT, S, Screenshot of a region to annotate (Satty), exec, $scripts/screenshot.sh annotate
# mute audio
bindd = $mainMod, M, Mute audio, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# sound devices: v2, el radio de Sonido de la rueda. SUPER+V era el menu de volumen
# de la v1, asi que la tecla conserva su significado.
bindd = $mainMod, V, Sound devices (input / output), exec, $bin sonido
# minimize / restore all windows
bindd = $mainMod, D, Show desktop (minimize all / restore), exec, $scripts/minimize.sh toggle
# window floating
bindd = $mainMod SHIFT, F, Floating on/off, exec, hyprctl --batch "dispatch togglefloating; dispatch resizeactive exact 1280 720; dispatch centerwindow"
# window fullscreen
bindd = $mainMod, F, Fullscreen on/off, fullscreen, 0
# theme picker: v2, el radio de Tema de la rueda
bindd = $mainMod, A, Theme Picker, exec, $bin tema
# v2: show every edge surface at once. The edges carry no marks, so this is the only
# way to see them all without going one by one. SHIFT because SUPER+A opens the wheel
# on its Tema panel, keeping the v1 key for the theme picker.
bindd = $mainMod SHIFT, A, Show all surfaces, exec, $bin all

# drag with the mouse while holding SUPER: left button moves, right button resizes
bindmd = $mainMod, mouse:272, Drag to move the window, movewindow
bindmd = $mainMod, mouse:273, Drag to resize the window, resizewindow
# window focus
bindd = $mainMod, left, Focus window on the left, movefocus, l
bindd = $mainMod, right, Focus window on the right, movefocus, r
bindd = $mainMod, up, Focus window above, movefocus, u
bindd = $mainMod, down, Focus window below, movefocus, d
# arrange windows inside a workspace
bindd = $mainMod SHIFT, left, Move window left (swap places), movewindow, l
bindd = $mainMod SHIFT, right, Move window right (swap places), movewindow, r
bindd = $mainMod SHIFT, up, Move window up (swap places), movewindow, u
bindd = $mainMod SHIFT, down, Move window down (swap places), movewindow, d
# resize windows with the keyboard (hold to repeat)
binded = $mainMod CTRL, left, Make window narrower (hold to repeat), resizeactive, -40 0
binded = $mainMod CTRL, right, Make window wider (hold to repeat), resizeactive, 40 0
binded = $mainMod CTRL, up, Make window shorter (hold to repeat), resizeactive, 0 -40
binded = $mainMod CTRL, down, Make window taller (hold to repeat), resizeactive, 0 40
# workspaces 1-10 (0 = workspace 10).
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
# send the window to a workspace and switch to that workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
# send the window to a workspace but stay where you are
bind = $mainMod ALT, 1, movetoworkspacesilent, 1
bind = $mainMod ALT, 2, movetoworkspacesilent, 2
bind = $mainMod ALT, 3, movetoworkspacesilent, 3
bind = $mainMod ALT, 4, movetoworkspacesilent, 4
bind = $mainMod ALT, 5, movetoworkspacesilent, 5
bind = $mainMod ALT, 6, movetoworkspacesilent, 6
bind = $mainMod ALT, 7, movetoworkspacesilent, 7
bind = $mainMod ALT, 8, movetoworkspacesilent, 8
bind = $mainMod ALT, 9, movetoworkspacesilent, 9
bind = $mainMod ALT, 0, movetoworkspacesilent, 10

# brightness / volume keys (also one line in the help menu)
# Pasan por `hfs`: cambia el valor y avisa al dock, que se asoma un segundo.
# Asi el dock hace de OSD y no hace falta uno aparte.
bindel = ,XF86MonBrightnessUp, exec, $bin bri up
bindel = ,XF86MonBrightnessDown, exec, $bin bri down
bindel = ,XF86AudioRaiseVolume, exec, $bin vol up
bindel = ,XF86AudioLowerVolume, exec, $bin vol down
bindel = ,XF86AudioMute, exec, $bin vol mute

# gesture = fingers, direction, action.
gesture = 3, down, dispatcher, exec, ~/hyprland-from-scratch/scripts/minimize.sh all
gesture = 3, up, dispatcher, exec, ~/hyprland-from-scratch/scripts/minimize.sh restore
gesture = 3, left, dispatcher, movefocus, l
gesture = 3, right, dispatcher, movefocus, r

gesture = 4, down, dispatcher, exec, ~/hyprland-from-scratch/scripts/volume.sh mute
gesture = 4, up, dispatcher, exec, ~/hyprland-from-scratch/scripts/volume.sh up 10
gesture = 4, horizontal, workspace

# gesture = pinchout, pinchin, action (floating)
gesture = 3, pinchout, dispatcher, exec, hyprctl --batch "dispatch setfloating; dispatch resizeactive exact 1280 720; dispatch centerwindow"
gesture = 3, pinchin, dispatcher, settiled