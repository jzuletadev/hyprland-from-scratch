# ~/hyprland-from-scratch/dotfiles/hypr/hyprland.conf
#
# Minimal Hyprland config — Phase 1 baseline, themed in Phase 10, refined in
# Phase 13 (look & feel), keybinds in Phase 14, re-themed in Phase 15 (Arch Neutral),
# popup animations / click-outside / wallpaper picker in Phase 17, settings,
# help and described keybinds in Phase 27.
# Every section is intentionally small so each future addition is a
# deliberate, understood change instead of inherited template noise.

# ---- Monitor ----
# The AOC 27G2G4 advertises 60 Hz as its "preferred" mode but supports 144 Hz,
# so it gets its own rule. Matched by description instead of port name so it
# follows the monitor to any connector (HDMI-A-1 today, DP-1 if the cable changes).
monitor = desc:AOC 27G2G4 GYGM6HA425243, 1920x1080@144, auto, 1
# ,preferred,auto,1  ->  any other monitor, preferred resolution/refresh, auto position, scale 1
monitor = ,preferred,auto,1

# ---- Environment ----
env = XCURSOR_SIZE,24

# ---- Input ----
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

# ---- Window border: size and colors live in appearance.conf (Phase 27) ----
source = ~/.config/hypr/appearance.conf

# ---- General look (Arch Neutral: bg #141414, fg #e0e0e0, Arch blue #1793d1, light #5db3df) ----
general {
    gaps_in = 4
    gaps_out = 8
    border_size = $border_size
    col.active_border = $border_active
    col.inactive_border = $border_inactive
    layout = dwindle
}

decoration {
    rounding = 10
    # Apps stay fully opaque (video, calls, games never show the wallpaper
    # through). kitty gets its "glass" from background_opacity in kitty.conf,
    # which keeps its text crisp — compositor opacity would fade the text too.
    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = true
        size = 6
        passes = 2
    }
}

animations {
    enabled = true
    bezier = smoothOut, 0.16, 1, 0.3, 1      # fast start, gentle stop: things arriving
    bezier = smoothIn, 0.32, 0, 0.67, 0      # gentle start, fast end: things leaving

    animation = windows, 1, 4, smoothOut, popin 80%
    animation = windowsOut, 1, 4, smoothOut, popin 80%
    animation = border, 1, 8, smoothOut
    animation = fade, 1, 4, smoothOut
    animation = workspaces, 1, 5, smoothOut, slide

    # Popups = layer-shell surfaces (Rofi menus, notifications, the bar).
    # Default style is a plain fade so the bar and wallpaper don't zoom at login;
    # the layer rules below give Rofi and notifications their own motion.
    animation = layersIn, 1, 3, smoothOut, fade
    animation = layersOut, 1, 2, smoothIn, fade
    animation = fadeLayersIn, 1, 3, smoothOut
    animation = fadeLayersOut, 1, 2, smoothIn
}

# ---- Layer rules (bar, launcher, notifications) ----
# Rule syntax since Hyprland 0.53: "<effect> <value>, match:<prop> <value>"
# (the old "layerrule = blur, waybar" form fails with "missing a value").
# ignore_alpha keeps blur off the fully transparent parts of Waybar's surface,
# so only the pills get frosted instead of the whole top strip.
layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0.5, match:namespace waybar
layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 0.5, match:namespace rofi
layerrule = animation popin 90%, match:namespace rofi                # menus grow in / shrink out
layerrule = animation slide right, match:namespace notifications     # dunst slides in from the edge

# ---- Misc ----
misc {
    disable_hyprland_logo = true     # no default wallpaper/logo flash at login
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = rgb(141414)   # shown behind awww while it starts
    # Phase 24: if hyprlock ever crashes, a new hyprlock may take over the lock
    # (from a TTY: `hyprctl --instance 0 dispatch exec hyprlock`) instead of the
    # session being stuck on the red "lockscreen died" screen
    allow_session_lock_restore = true
}

# ---- Autostart ----
exec-once = awww-daemon
exec-once = ~/hyprland-from-scratch/scripts/wallpaper.sh restore   # last wallpaper picked (default: 3.jpeg)
# Waybar is NOT started here: it runs as a systemd user service
# (`systemctl --user enable --now waybar.service`), which restarts it if it
# crashes. Restart it with `systemctl --user restart waybar` (see Phase 22).
exec-once = dunst
exec-once = hypridle
# light/dark theme for apps (GTK, libadwaita, websites that follow the system),
# the one picked in the settings menu; dark by default (Phase 27)
exec-once = ~/hyprland-from-scratch/scripts/theme.sh restore

# ---- Workspaces ----
# Hyprland's default behavior (Phase 36): each monitor starts with its own
# workspace, and SUPER+<n> creates workspace n on the focused monitor (or goes
# to the monitor that already has it). Phases 27/35 made 1-5 persistent so the
# bar always showed them; that needed every workspace pinned to a monitor and
# broke after a cold boot, so it was dropped.

# ---- Window rules ----
# system info (fastfetch) opened from the Arch logo in Waybar — scripts/sysinfo.sh
windowrule = float on, match:class sysinfo
windowrule = size 820 460, match:class sysinfo
windowrule = center on, match:class sysinfo

# ---- Keybinds ----
# Binds with a description use `bindd` (MODS, key, description, dispatcher, args):
# the help menu (SUPER + /, scripts/rofi-keybinds.py) lists exactly these, read
# live from `hyprctl binds -j`, so it can't drift from this file.
$mainMod = SUPER
$terminal = kitty
$scripts = ~/hyprland-from-scratch/scripts

# launchers. Tapping SUPER alone opens/closes the quick app search (a release
# bind on the key itself; it doesn't fire after SUPER+<key> combos, because a
# release bind only triggers when the released key was the last one pressed).
bindrd = $mainMod, Super_L, App search, exec, pkill -x rofi || rofi -show drun -theme ~/.config/rofi/search.rasi
bindd = $mainMod, R, Launcher with all modes (apps / run / files / windows), exec, pkill -x rofi || rofi -show drun
bindd = $mainMod, slash, Keybindings help (this list), exec, $scripts/rofi-keybinds.py

# apps
bindd = $mainMod, T, Terminal (kitty), exec, $terminal
bindd = $mainMod, E, File manager (Thunar), exec, thunar
bindd = $mainMod, Escape, System monitor (btop), exec, [float;size 800 500;center] kitty --class btop-floating -e btop
bindd = $mainMod, W, Wallpaper picker, exec, $scripts/wallpaper.sh

# windows
bindd = $mainMod, Q, Close window, killactive,
bindd = $mainMod, F, Fullscreen on/off (hides the bar), fullscreen, 0
bindd = $mainMod, V, Floating on/off, togglefloating,
bindd = $mainMod, left, Focus window on the left, movefocus, l
bindd = $mainMod, right, Focus window on the right, movefocus, r
bindd = $mainMod, up, Focus window above, movefocus, u
bindd = $mainMod, down, Focus window below, movefocus, d
# Phase 31: arrange windows inside a workspace
bindd = $mainMod SHIFT, left, Move window left (swap places), movewindow, l
bindd = $mainMod SHIFT, right, Move window right (swap places), movewindow, r
bindd = $mainMod SHIFT, up, Move window up (swap places), movewindow, u
bindd = $mainMod SHIFT, down, Move window down (swap places), movewindow, d
bindd = $mainMod, J, Side by side <-> stacked (toggle split), layoutmsg, togglesplit
binded = $mainMod CTRL, left, Make window narrower (hold to repeat), resizeactive, -40 0
binded = $mainMod CTRL, right, Make window wider (hold to repeat), resizeactive, 40 0
binded = $mainMod CTRL, up, Make window shorter (hold to repeat), resizeactive, 0 -40
binded = $mainMod CTRL, down, Make window taller (hold to repeat), resizeactive, 0 40
# drag with the mouse while holding SUPER: left button moves, right button resizes
bindmd = $mainMod, mouse:272, Drag to move the window, movewindow
bindmd = $mainMod, mouse:273, Drag to resize the window, resizewindow
# minimize (Hyprland has none: windows wait on a hidden special workspace)
bindd = $mainMod, N, Minimize window, exec, $scripts/minimize.sh window
bindd = $mainMod SHIFT, N, Restore minimized windows here, exec, $scripts/minimize.sh restore
bindd = $mainMod, D, Show desktop (minimize all / restore), exec, $scripts/minimize.sh toggle

# capture
bindd = $mainMod, S, Screenshot of the monitor (saved + copied), exec, $scripts/screenshot.sh screen
bindd = $mainMod SHIFT, S, Screenshot of a region (saved + copied), exec, $scripts/screenshot.sh region
bindd = $mainMod CTRL, S, Screenshot of the window (saved + copied), exec, $scripts/screenshot.sh window
bindd = $mainMod ALT, S, Screenshot of a region to annotate (Satty), exec, $scripts/screenshot.sh annotate
bindd = $mainMod SHIFT, R, Screen recording (again: stop and save), exec, $scripts/screen-record.sh

# session
bindd = $mainMod, L, Lock screen, exec, hyprlock
bindd = $mainMod, M, Exit Hyprland (log out), exit,

# workspaces 1-10 (0 = workspace 10). Hyprland creates workspaces on demand and
# has no practical limit — only these binds decide what's reachable. Shown as
# one line in the help menu, so no descriptions here.
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
# Phase 31: send the window to a workspace but stay where you are
bind = $mainMod ALT, 1, movetoworkspacesilent, 1
bind = $mainMod ALT, 2, movetoworkspacesilent, 2
bind = $mainMod ALT, 3, movetoworkspacesilent, 3
bind = $mainMod ALT, 4, movetoworkspacesilent, 4
bind = $mainMod ALT, 5, movetoworkspacesilent, 5
bind = $mainMod ALT, 6, movetoworkspacesilent, 6
bind = $mainMod ALT, 7, movetoworkspacesilent, 7
bind = $mainMod ALT, 8, movetoworkspacesilent, 8
bind = $mainMod ALT, 9, movetoworkspacesilent, 9
bind = $mainMod ALT, 0, movetoworkspacesilent, 10

# brightness / volume keys (also one line in the help menu)
bindel = ,XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Close an open Rofi menu when clicking outside it. Non-consuming (bindn): the
# click still reaches the window under the cursor. The script exits at once
# when no menu is open.
bindn = , mouse:272, exec, $scripts/rofi-click-outside.sh

# ---- Touchpad gestures (Phase 31) ----
# gesture = fingers, direction, action. A "dispatcher" gesture fires once per
# swipe. Syntax of Hyprland 0.51+ (checked with `hyprctl keyword gesture`).
gesture = 3, down, dispatcher, exec, ~/hyprland-from-scratch/scripts/minimize.sh all
gesture = 3, up, dispatcher, exec, ~/hyprland-from-scratch/scripts/minimize.sh restore
gesture = 3, left, dispatcher, movefocus, l
gesture = 3, right, dispatcher, movefocus, r
# volume: 10% per swipe (a dispatcher gesture fires once per swipe, and 5%
# needed several swipes to be heard), with an on-screen level — Phase 34
gesture = 4, down, dispatcher, exec, ~/hyprland-from-scratch/scripts/volume.sh down 10
gesture = 4, up, dispatcher, exec, ~/hyprland-from-scratch/scripts/volume.sh up 10
# Phase 32: swipe between workspaces (animated, follows the fingers)
gesture = 4, horizontal, workspace
# Phase 32: spread 3 fingers = fullscreen, pinch them = back. Explicit states
# (fullscreenstate <internal> <client>: 2 = fullscreen, 0 = none, -1 = keep the
# app's own state) instead of a toggle, so an extra pinch can't flip it back.
gesture = 3, pinchout, dispatcher, fullscreenstate, 2 -1
gesture = 3, pinchin, dispatcher, fullscreenstate, 0 -1
