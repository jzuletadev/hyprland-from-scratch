# ~/hyprland-from-scratch/dotfiles/hypr/hyprland.conf
#
# Minimal Hyprland config — Phase 1 baseline, themed in Phase 10, refined in
# Phase 13 (look & feel), keybinds in Phase 14, re-themed in Phase 15 (Arch Neutral),
# popup animations / click-outside / wallpaper picker in Phase 17.
# Every section is intentionally small so each future addition is a
# deliberate, understood change instead of inherited template noise.

# ---- Monitor ----
# The AOC 27G2G4 advertises 60 Hz as its "preferred" mode but supports 144 Hz,
# so it gets its own rule. Matched by description instead of port name so it
# follows the monitor to any connector (HDMI-A-1 today, DP-1 if the cable changes).
monitor = desc:AOC 27G2G4 GYGM6HA425243, 1920x1080@144, auto, 1
# ,preferred,auto,1  ->  any other monitor, preferred resolution/refresh, auto position, scale 1
monitor = ,preferred,auto,1

# ---- Environment ----
env = XCURSOR_SIZE,24

# ---- Input ----
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

# ---- General look (Arch Neutral: bg #141414, fg #e0e0e0, Arch blue #1793d1, light #5db3df) ----
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(1793d1ff) rgba(5db3dfff) 45deg
    col.inactive_border = rgba(333333aa)
    layout = dwindle
}

decoration {
    rounding = 10
    # Apps stay fully opaque (video, calls, games never show the wallpaper
    # through). kitty gets its "glass" from background_opacity in kitty.conf,
    # which keeps its text crisp — compositor opacity would fade the text too.
    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = true
        size = 6
        passes = 2
    }
}

animations {
    enabled = true
    bezier = smoothOut, 0.16, 1, 0.3, 1      # fast start, gentle stop: things arriving
    bezier = smoothIn, 0.32, 0, 0.67, 0      # gentle start, fast end: things leaving

    animation = windows, 1, 4, smoothOut, popin 80%
    animation = windowsOut, 1, 4, smoothOut, popin 80%
    animation = border, 1, 8, smoothOut
    animation = fade, 1, 4, smoothOut
    animation = workspaces, 1, 5, smoothOut, slide

    # Popups = layer-shell surfaces (Rofi menus, notifications, the bar).
    # Default style is a plain fade so the bar and wallpaper don't zoom at login;
    # the layer rules below give Rofi and notifications their own motion.
    animation = layersIn, 1, 3, smoothOut, fade
    animation = layersOut, 1, 2, smoothIn, fade
    animation = fadeLayersIn, 1, 3, smoothOut
    animation = fadeLayersOut, 1, 2, smoothIn
}

# ---- Layer rules (bar, launcher, notifications) ----
# Rule syntax since Hyprland 0.53: "<effect> <value>, match:<prop> <value>"
# (the old "layerrule = blur, waybar" form fails with "missing a value").
# ignore_alpha keeps blur off the fully transparent parts of Waybar's surface,
# so only the pills get frosted instead of the whole top strip.
layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0.5, match:namespace waybar
layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 0.5, match:namespace rofi
layerrule = animation popin 90%, match:namespace rofi                # menus grow in / shrink out
layerrule = animation slide right, match:namespace notifications     # dunst slides in from the edge

# ---- Misc ----
misc {
    disable_hyprland_logo = true     # no default wallpaper/logo flash at login
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = rgb(141414)   # shown behind awww while it starts
}

# ---- Keybinds ----
$mainMod = SUPER
$terminal = kitty
$scripts = ~/hyprland-from-scratch/scripts

bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, V, togglefloating,

# move focus between windows
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# switch workspaces 1-10 (0 = workspace 10). Hyprland creates workspaces on
# demand and has no practical limit — only these binds decide what's reachable.
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
# move active window to workspace 1-10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

exec-once = awww-daemon
exec-once = $scripts/wallpaper.sh restore   # last wallpaper picked (default: 3.jpeg)
# Waybar is NOT started here: it runs as a systemd user service
# (`systemctl --user enable --now waybar.service`), which restarts it if it
# crashes. Restart it with `systemctl --user restart waybar` (see Phase 22).
exec-once = dunst
exec-once = hypridle
# Dark mode for GTK3 apps (Thunar, file pickers), GTK4/libadwaita apps, and
# websites that follow the system theme. Set at login so it lives in the repo
# instead of only in dconf.
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita-dark'
bind = $mainMod, L, exec, hyprlock

# App launcher. Tapping SUPER alone opens/closes it (release bind on the key
# itself); it doesn't fire after SUPER+<key> combos, because a release bind only
# triggers when the released key was the last key pressed. SUPER+R still works.
bindr = $mainMod, Super_L, exec, pkill -x rofi || rofi -show drun
bind = $mainMod, R, exec, rofi -show drun

# Close an open Rofi menu when clicking outside it. Non-consuming (bindn): the
# click still reaches the window under the cursor. The script exits at once
# when no menu is open.
bindn = , mouse:272, exec, $scripts/rofi-click-outside.sh

# wallpaper picker (thumbnail grid)
bind = $mainMod, W, exec, $scripts/wallpaper.sh

bind = $mainMod, E, exec, thunar

bindel = ,XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl set 5%-

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# screenshots: saved to ~/Pictures/screenshots AND copied to the clipboard
bind = $mainMod, S, exec, $scripts/screenshot.sh screen         # focused monitor
bind = $mainMod SHIFT, S, exec, $scripts/screenshot.sh region   # drag a box
bind = $mainMod CTRL, S, exec, $scripts/screenshot.sh window    # focused window
# screen recording: menu (screen/region, with/without audio); again = stop and save
bind = $mainMod SHIFT, R, exec, $scripts/screen-record.sh

# system monitor, floating+centered via an inline exec rule. Equivalent
# windowrule form (0.53+ syntax): windowrule = float on, match:class btop-floating
bind = $mainMod, Escape, exec, [float;size 800 500;center] kitty --class btop-floating -e btop

# system info (fastfetch) opened from the Arch logo in Waybar — scripts/sysinfo.sh
windowrule = float on, match:class sysinfo
windowrule = size 820 460, match:class sysinfo
windowrule = center on, match:class sysinfo
