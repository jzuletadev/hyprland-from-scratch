# ~/hyprland-from-scratch/dotfiles/hypr/hyprland.conf

# ,preferred,auto,1  ->  any other monitor, preferred resolution/refresh, auto position, scale 1
monitor = ,preferred,auto,1

# ---- Environment ----
env = XCURSOR_SIZE,20
env = EDITOR,nvim
env = VISUAL,nvim

# ---- Input ----
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

# ---- Window border: size and colors live in appearance.conf (Phase 27) ----
source = ~/.config/hypr/appearance.conf

# ---- General look ----
general {
    gaps_in = 3
    gaps_out = 2, 6, 6, 6
    border_size = $border_size
    col.active_border = $border_active
    col.inactive_border = $border_inactive
    layout = dwindle
    resize_on_border = true
    extend_border_grab_area = 15
    hover_icon_on_border = true
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = true
        size = 6
        passes = 2
    }
}

animations {
    enabled = true
    bezier = smoothOut, 0.16, 1, 0.3, 1      # fast start, gentle stop: things arriving
    bezier = smoothIn, 0.32, 0, 0.67, 0      # gentle start, fast end: things leaving

    animation = windows, 1, 4, smoothOut, popin 80%
    animation = windowsOut, 1, 4, smoothOut, popin 80%
    animation = border, 1, 8, smoothOut
    animation = fade, 1, 4, smoothOut
    animation = workspaces, 1, 5, smoothOut, slide

    # Popups = layer-shell surfaces (Rofi menus, notifications, the bar).
    animation = layersIn, 1, 3, smoothOut, fade
    animation = layersOut, 1, 2, smoothIn, fade
    animation = fadeLayersIn, 1, 3, smoothOut
    animation = fadeLayersOut, 1, 2, smoothIn
}

# ---- Layer rules (bar, launcher, notifications) ----
layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0.5, match:namespace waybar
layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 0.5, match:namespace rofi
layerrule = animation popin 20%, match:namespace rofi                # menus grow in / shrink out
layerrule = animation slide right, match:namespace notifications     # dunst slides in from the edge

# ---- Misc ----
misc {
    disable_hyprland_logo = true     # no default wallpaper/logo flash at login
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = rgb(141414)   # shown behind awww while it starts
    allow_session_lock_restore = true
}

# ---- Autostart ----
exec-once = awww-daemon
exec-once = ~/hyprland-from-scratch/scripts/wallpaper.sh restore   # last wallpaper picked

exec-once = dunst
exec-once = hypridle

# ---- Window rules ----

# SYSINFO
windowrule = float on, match:class sysinfo
windowrule = size 920 460, match:class sysinfo
windowrule = center on, match:class sysinfo

# TASK MANAGER
windowrule = float on, match:class btop-floating
windowrule = size 1050 650, match:class btop-floating
windowrule = center on, match:class btop-floating

# POWER PROFILE
windowrule = float on, match:class power-floating
windowrule = size 540 280, match:class power-floating
windowrule = center on, match:class power-floating

# BRIGHTNESS CONTROL
windowrule = float on, match:class brightness-floating
windowrule = size 540 330, match:class brightness-floating
windowrule = center on, match:class brightness-floating

# VOLUME CONTROL
windowrule = float on, match:class volume-floating
windowrule = size 540 330, match:class volume-floating
windowrule = center on, match:class volume-floating

# SCREEN RECORDER
windowrule = float on, match:class recorder-floating
windowrule = size 480 250, match:class recorder-floating
windowrule = center on, match:class recorder-floating

# THEME PICKER
windowrule = float on, match:class theme-floating
windowrule = size 540 320, match:class theme-floating
windowrule = center on, match:class theme-floating

# WALLPAPER PICKER
windowrule = float on, match:class wallpaper-floating
windowrule = size 540 360, match:class wallpaper-floating
windowrule = center on, match:class wallpaper-floating

# KEYBINDS HELP
windowrule = float on, match:class keybinds-floating
windowrule = size 680 480, match:class keybinds-floating
windowrule = center on, match:class keybinds-floating

# CALENDAR
windowrule = float on, match:class calendar-floating
windowrule = size 360 260, match:class calendar-floating
windowrule = center on, match:class calendar-floating

# WIFI MANAGER
windowrule = float on, match:class wifi-floating
windowrule = size 540 320, match:class wifi-floating
windowrule = center on, match:class wifi-floating

# BLUETOOTH MANAGER
windowrule = float on, match:class bluetooth-floating
windowrule = size 500 280, match:class bluetooth-floating
windowrule = center on, match:class bluetooth-floating

# MPV
windowrule = float on, match:class mpv
windowrule = size 960 540, match:class mpv
windowrule = center on, match:class mpv

# ---- Keybinds ----
$mainMod = SUPER
$terminal = kitty
$scripts = ~/hyprland-from-scratch/scripts

# launcher
bindrd = $mainMod, Super_L, App search, exec, pkill -x rofi || rofi -show drun -theme ~/.config/rofi/search.rasi
# power menu
bindd = $mainMod, Escape, Power Menu, exec, $terminal --class power-floating -e python3 $scripts/power-tui.py
# task manager
bindd = $mainMod SHIFT, Escape, Task Manager (btop), exec, $terminal --class btop-floating -e btop
# keybinds help menu
bindd = $mainMod, slash, Keybindings Help, exec, $terminal --class keybinds-floating -e python3 $scripts/keybinds-tui.py
# session
bindd = $mainMod, L, Lock screen, exec, hyprlock
# power profile
bindd = $mainMod, P, Power Profile Selector, exec, $terminal --class power-floating -e python3 $scripts/power-profile-tui.py
# windows close
bindd = $mainMod, Q, Close window, killactive,
# wallpaper picker
bindd = $mainMod, W, Wallpaper Picker, exec, $terminal --class wallpaper-floating -e python3 $scripts/wallpaper-tui.py
# file manager
bindd = $mainMod, E, File manager (Yazi), exec, $terminal -e yazi
bindd = $mainMod SHIFT, E, File manager with hidden files (Yazi), exec, env YAZI_CONFIG_HOME=$HOME/hyprland-from-scratch/dotfiles/yazi-hidden $terminal -e yazi
# screen record
bindd = $mainMod, R, Screen Record Menu, exec, $terminal --class recorder-floating -e python3 $scripts/screen-record-tui.py
# terminal
bindd = $mainMod, T, Terminal (kitty), exec, $terminal
# brightness
bindd = $mainMod, G, Brightness Control, exec, $terminal --class brightness-floating -e python3 $scripts/brightness-tui.py
# screenshots (saved + copied to clipboard)
bindd = $mainMod, S, Screenshot of the monitor (saved + copied), exec, $scripts/screenshot.sh screen
bindd = $mainMod SHIFT, S, Screenshot of a region (saved + copied), exec, $scripts/screenshot.sh region
bindd = $mainMod CTRL, S, Screenshot of the window (saved + copied), exec, $scripts/screenshot.sh window
bindd = $mainMod ALT, S, Screenshot of a region to annotate (Satty), exec, $scripts/screenshot.sh annotate
# mute audio
bindd = $mainMod, M, Mute audio, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# minimize / restore all windows
bindd = $mainMod, D, Show desktop (minimize all / restore), exec, $scripts/minimize.sh toggle
# window floating
bindd = $mainMod SHIFT, F, Floating on/off, togglefloating,
# window fullscreen
bindd = $mainMod, F, Fullscreen on/off (hides the bar), fullscreen, 0
# wifi
bindd = $mainMod, Z, Wi-Fi Manager, exec, $terminal --class wifi-floating -e python3 $scripts/wifi-tui.py
# calendar
bindd = $mainMod, C, Calendar, exec, $terminal --class calendar-floating -e python3 $scripts/calendar-tui.py
# volume
bindd = $mainMod, V, Volume Menu, exec, $terminal --class volume-floating -e python3 $scripts/volume-tui.py
# bluetooth
bindd = $mainMod, B, Bluetooth Manager, exec, $terminal --class bluetooth-floating -e python3 $scripts/bluetooth-tui.py
# theme picker
bindd = $mainMod, A, Theme Picker, exec, $terminal --class theme-floating -e python3 $scripts/theme-tui.py

# drag with the mouse while holding SUPER: left button moves, right button resizes
bindmd = $mainMod, mouse:272, Drag to move the window, movewindow
bindmd = $mainMod, mouse:273, Drag to resize the window, resizewindow
# window focus
bindd = $mainMod, left, Focus window on the left, movefocus, l
bindd = $mainMod, right, Focus window on the right, movefocus, r
bindd = $mainMod, up, Focus window above, movefocus, u
bindd = $mainMod, down, Focus window below, movefocus, d
# arrange windows inside a workspace
bindd = $mainMod SHIFT, left, Move window left (swap places), movewindow, l
bindd = $mainMod SHIFT, right, Move window right (swap places), movewindow, r
bindd = $mainMod SHIFT, up, Move window up (swap places), movewindow, u
bindd = $mainMod SHIFT, down, Move window down (swap places), movewindow, d
# resize windows with the keyboard (hold to repeat)
binded = $mainMod CTRL, left, Make window narrower (hold to repeat), resizeactive, -40 0
binded = $mainMod CTRL, right, Make window wider (hold to repeat), resizeactive, 40 0
binded = $mainMod CTRL, up, Make window shorter (hold to repeat), resizeactive, 0 -40
binded = $mainMod CTRL, down, Make window taller (hold to repeat), resizeactive, 0 40
# workspaces 1-10 (0 = workspace 10).
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
# send the window to a workspace and switch to that workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
# send the window to a workspace but stay where you are
bind = $mainMod ALT, 1, movetoworkspacesilent, 1
bind = $mainMod ALT, 2, movetoworkspacesilent, 2
bind = $mainMod ALT, 3, movetoworkspacesilent, 3
bind = $mainMod ALT, 4, movetoworkspacesilent, 4
bind = $mainMod ALT, 5, movetoworkspacesilent, 5
bind = $mainMod ALT, 6, movetoworkspacesilent, 6
bind = $mainMod ALT, 7, movetoworkspacesilent, 7
bind = $mainMod ALT, 8, movetoworkspacesilent, 8
bind = $mainMod ALT, 9, movetoworkspacesilent, 9
bind = $mainMod ALT, 0, movetoworkspacesilent, 10

# brightness / volume keys (also one line in the help menu)
# bindel = ,XF86MonBrightnessUp, exec, brightnessctl set 5%+
# bindel = ,XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindle = ,XF86MonBrightnessUp, exec, brightnessctl -d amdgpu_bl1 set +5%
bindle = ,XF86MonBrightnessDown, exec, brightnessctl -d amdgpu_bl1 set 5%-
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle


# ---- Touchpad gestures (Phase 31) ----
# gesture = fingers, direction, action. A "dispatcher" gesture fires once per
# swipe. Syntax of Hyprland 0.51+ (checked with `hyprctl keyword gesture`).
gesture = 3, down, dispatcher, exec, ~/hyprland-from-scratch/scripts/minimize.sh all
gesture = 3, up, dispatcher, exec, ~/hyprland-from-scratch/scripts/minimize.sh restore
gesture = 3, left, dispatcher, movefocus, l
gesture = 3, right, dispatcher, movefocus, r
# volume: 10% per swipe (a dispatcher gesture fires once per swipe, and 5%
# needed several swipes to be heard), with an on-screen level — Phase 34
gesture = 4, down, dispatcher, exec, ~/hyprland-from-scratch/scripts/volume.sh down 10
gesture = 4, up, dispatcher, exec, ~/hyprland-from-scratch/scripts/volume.sh up 10
# Phase 32: swipe between workspaces (animated, follows the fingers)
gesture = 4, horizontal, workspace
# Phase 32: spread 3 fingers = fullscreen, pinch them = back. Explicit states
# (fullscreenstate <internal> <client>: 2 = fullscreen, 0 = none, -1 = keep the
# app's own state) instead of a toggle, so an extra pinch can't flip it back.
gesture = 3, pinchout, dispatcher, fullscreenstate, 2 -1
gesture = 3, pinchin, dispatcher, fullscreenstate, 0 -1
