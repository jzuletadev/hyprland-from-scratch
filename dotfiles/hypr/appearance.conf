# ~/hyprland-from-scratch/dotfiles/hypr/appearance.conf
#
# Phase 27. Window border, in one place. Sourced by hyprland.conf; Hyprland
# reloads as soon as this file is saved. Edit the values by hand, or use the
# settings menu (right-click the Arch logo -> Window border), which rewrites
# the lines below with scripts/rofi-settings.sh.
#
# Colors are rgba(RRGGBBAA): the last two digits are the opacity (ff = solid).

$border_size = 1
$border_active = rgba(e0a84ecc)
$border_inactive = rgba(333333aa)
