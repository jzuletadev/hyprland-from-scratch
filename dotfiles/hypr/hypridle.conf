# ~/hyprland-from-scratch/dotfiles/hypr/hypridle.conf
#Idle stages — Phase 8 baseline, revised in Phase 24:
# dim (15 min) -> lock (30) -> screens off (35) -> suspend, on battery only (75).
# Each listener fires independently once its timeout is reached; any input
# runs the on-resume commands.
#
# Note: the example shipped in /usr/share/hypr/hypridle.conf uses
# `hyprctl dispatch 'hl.dsp.dpms(...)'`, the syntax of Hyprland's Lua config.
# With hyprland.conf that answers "Invalid dispatcher"; `dpms on/off` is right here.

general {
    lock_cmd = pidof hyprlock || hyprlock     # never two lock screens
    before_sleep_cmd = loginctl lock-session  # locked before suspending
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 15 min: atenuar brillo (solo en batería)
listener {
    timeout = 900
    on-timeout = ~/hyprland-from-scratch/scripts/idle.sh dim
    on-resume = brightnessctl -q -r
}

# 30 min: bloquear sesión (solo en batería)
listener {
    timeout = 1800
    on-timeout = ~/hyprland-from-scratch/scripts/idle.sh lock
}

# 35 min: apagar pantalla (solo en batería)
listener {
    timeout = 2100
    on-timeout = ~/hyprland-from-scratch/scripts/idle.sh dpms-off
    on-resume = hyprctl dispatch dpms on
}

# 75 min: suspender (solo en batería)
listener {
    timeout = 4500
    on-timeout = ~/hyprland-from-scratch/scripts/idle.sh suspend
}
