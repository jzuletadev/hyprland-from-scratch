# ~/hyprland-from-scratch/dotfiles/hypr/hypridle.conf
#
# Minimal hypridle config — Phase 8 baseline.
# Staged timeouts: dim -> lock -> screen off -> suspend.
# Each listener fires independently once its timeout is reached.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# dim the screen after 15 minutes of inactivity
listener {
    timeout = 900
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# lock the session after 30 minutes
listener {
    timeout = 1800
    on-timeout = loginctl lock-session
}

# turn the screen off after 35 minutes
listener {
    timeout = 2100
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# suspend the system after 75 minutes
listener {
    timeout = 4500
    on-timeout = systemctl suspend
}
