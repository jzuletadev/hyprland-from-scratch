# ~/hyprland-from-scratch/dotfiles/hypr/hyprlock.conf
#
# Minimal hyprlock config — Phase 7 baseline, themed in Phase 10, re-themed in Phase 15 (Arch Neutral).
# Password field + clock only.

background {
    monitor =
    # symlink kept by scripts/wallpaper.sh: the lock screen follows the desktop
    path = ~/.local/state/hyprland-from-scratch/wallpaper
    blur_passes = 3
    blur_size = 6
}

input-field {
    monitor =
    size = 250, 50
    position = 0, -80
    halign = center
    valign = center
    outer_color = rgb(23, 147, 209)
    inner_color = rgb(20, 20, 20)
    font_color = rgb(224, 224, 224)
    placeholder_text = <span foreground="##a8a8a8">Password...</span>
    fade_on_empty = false
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = rgba(224, 224, 224, 1.0)
    font_size = 64
    position = 0, 80
    halign = center
    valign = center
}
