# ~/hyprland-from-scratch/dotfiles/hypr/hyprlock.conf
#
# Minimal hyprlock config — Phase 7 baseline, themed in Phase 10 (Tokyo Night).
# Password field + clock only.

background {
    monitor =
    path = ~/hyprland-from-scratch/assets/wallpapers/1.jpg
    blur_passes = 3
    blur_size = 6
}

input-field {
    monitor =
    size = 250, 50
    position = 0, -80
    halign = center
    valign = center
    outer_color = rgb(122, 162, 247)
    inner_color = rgb(26, 27, 38)
    font_color = rgb(192, 202, 245)
    placeholder_text = <span foreground="##c0caf5">Password...</span>
    fade_on_empty = false
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = rgba(192, 202, 245, 1.0)
    font_size = 64
    position = 0, 80
    halign = center
    valign = center
}
