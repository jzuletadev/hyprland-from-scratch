# ~/hyprland-from-scratch/dotfiles/hypr/hyprlock.conf
#
# Minimal hyprlock config — Phase 7 baseline.
# Password field + clock only. Background image and theming come later.

background {
    monitor =
    path = ~/hyprland-from-scratch/assets/wallpapers/1.jpg
    blur_passes = 2
    blur_size = 4
}

input-field {
    monitor =
    size = 250, 50
    position = 0, -80
    halign = center
    valign = center
    outer_color = rgb(88c0d0)
    inner_color = rgb(30, 30, 46)
    font_color = rgb(205, 214, 244)
    placeholder_text = <span foreground="##cdd6f4">Password...</span>
    fade_on_empty = false
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = rgba(205, 214, 244, 1.0)
    font_size = 64
    position = 0, 80
    halign = center
    valign = center
}
