# ~/hyprland-from-scratch/dotfiles/btop/btop.conf
#
# btop config — Phase 11 baseline, re-themed in Phase 15. Just enough to point
# at the theme (themes/arch.theme) and pick a sane default view; everything
# else is btop's defaults.

color_theme = "arch"
theme_background = True
vim_keys = False
update_ms = 2000
proc_sorting = "cpu lazy"
show_gpu_info = "Auto"
